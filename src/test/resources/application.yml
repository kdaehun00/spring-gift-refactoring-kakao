spring:
  application:
    name: spring-gift
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

jwt:
  secret: a-string-secret-at-least-256-bits-long-for-test-environment
  expiration: 3600000

kakao:
  login:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/api/v1/auth/kakao/callback
    authorize-url: https://kauth.kakao.com/oauth/authorize
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
    scope: account_email,talk_message
  api:
    message-send-url: https://kapi.kakao.com/v2/api/talk/memo/default/send
