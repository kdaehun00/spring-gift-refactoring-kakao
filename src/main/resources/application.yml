spring:
  application:
    name: spring-gift

jwt:
  secret: ${JWT_SECRET:a-string-secret-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:3600000}

kakao:
  login:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
    authorize-url: https://kauth.kakao.com/oauth/authorize
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
    scope: account_email,talk_message
  api:
    message-send-url: https://kapi.kakao.com/v2/api/talk/memo/default/send
